# P16-A: Hard-Mode Redis Neutralization — generated by pr-validation-agent
# ROOT CAUSE: LettuceConnectionFactory attempts TCP connect to localhost:6379 during
# @SpringBootTest context startup. port:-1 is a Lettuce no-op (still connects).
# FIX: autoconfigure.exclude removes Redis/Cache autoconfig entirely at the
# Spring Boot level — no TCP socket is ever opened, even for shared contexts.
# Scope: global (applies to ALL test classes via active profile "test").
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration
  cache:
    type: none
  main:
    allow-bean-definition-overriding: true
