name: PR Agent Tests

"on":
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull Request number
        required: true
        type: string
      head_sha:
        description: PR head sha
        required: true
        type: string
      agent_run_id:
        description: Agent run id
        required: true
        type: string
      detected_stack:
        description: JSON string describing detected stack
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  PR_AGENT_TEMPLATE_VERSION: "20"

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse detected stack
        id: stack
        shell: bash
        run: |
          echo "detected_stack=${{ inputs.detected_stack }}" >> $GITHUB_OUTPUT
          echo "lang=$(python3 -c "import json,sys; print(json.loads(sys.argv[1]).get('language',''))" '${{ inputs.detected_stack }}')" >> $GITHUB_OUTPUT

      - name: Detect Java version from pom.xml
        if: ${{ steps.stack.outputs.lang == 'java' }}
        id: java_version
        shell: bash
        run: |
          JAVA_VER=""
          if [ -f pom.xml ]; then
            # Try maven.compiler.release, maven.compiler.source, java.version
            for TAG in maven.compiler.release maven.compiler.source java.version; do
              VAL=$(sed -n "s/.*<${TAG}>\([^<]*\)<.*/\1/p" pom.xml 2>/dev/null | head -1)
              if [ -n "$VAL" ]; then
                JAVA_VER="$VAL"
                break
              fi
            done
          fi
          # Default to 17 if not detected (widely compatible)
          if [ -z "$JAVA_VER" ]; then
            JAVA_VER="17"
          fi
          # Normalize: "1.8" -> "8"
          if [[ "$JAVA_VER" == 1.* ]]; then
            JAVA_VER="${JAVA_VER#1.}"
          fi
          echo "version=$JAVA_VER" >> $GITHUB_OUTPUT
          echo "Detected Java version: $JAVA_VER"

      - name: Setup Java (Temurin)
        if: ${{ steps.stack.outputs.lang == 'java' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java_version.outputs.version }}
          cache: maven

      - name: Setup Node
        if: ${{ steps.stack.outputs.lang == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        if: ${{ steps.stack.outputs.lang == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PR_AGENT_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          STACK='${{ inputs.detected_stack }}'
          echo "$STACK" > detected_stack.json

          LANG=$(python -c "import json; print(json.load(open('detected_stack.json')).get('language',''))")
          FW=$(python -c "import json; print(json.load(open('detected_stack.json')).get('framework',''))")

          mkdir -p pr-agent-artifacts

          if [ "$LANG" = "java" ]; then
            # Inject JaCoCo plugin via string insertion (preserves pom.xml structure)
            if ! grep -q 'jacoco-maven-plugin' pom.xml 2>/dev/null; then
              python3 <<'JACOCO_PYEOF' || true
          import sys
          try:
              with open('pom.xml', 'r') as f:
                  pom = f.read()
              NL = chr(10)
              plugin_xml = (
                  NL + '      <plugin>'
                  + NL + '        <groupId>org.jacoco</groupId>'
                  + NL + '        <artifactId>jacoco-maven-plugin</artifactId>'
                  + NL + '        <version>0.8.11</version>'
                  + NL + '        <executions>'
                  + NL + '          <execution>'
                  + NL + '            <id>prepare-agent</id>'
                  + NL + '            <goals><goal>prepare-agent</goal></goals>'
                  + NL + '            <phase>initialize</phase>'
                  + NL + '          </execution>'
                  + NL + '          <execution>'
                  + NL + '            <id>report</id>'
                  + NL + '            <goals><goal>report</goal></goals>'
                  + NL + '            <phase>test</phase>'
                  + NL + '          </execution>'
                  + NL + '        </executions>'
                  + NL + '      </plugin>')
              idx = pom.rfind('</plugins>')
              if idx != -1:
                  pom = pom[:idx] + plugin_xml + NL + '    ' + pom[idx:]
              else:
                  idx = pom.rfind('</build>')
                  if idx != -1:
                      pom = pom[:idx] + '  <plugins>' + plugin_xml + NL + '    </plugins>' + NL + '  ' + pom[idx:]
                  else:
                      idx = pom.rfind('</project>')
                      if idx != -1:
                          pom = pom[:idx] + '  <build>' + NL + '    <plugins>' + plugin_xml + NL + '    </plugins>' + NL + '  </build>' + NL + pom[idx:]
              with open('pom.xml', 'w') as f:
                  f.write(pom)
              print('JaCoCo plugin injected')
          except Exception as e:
              print('JaCoCo injection skipped: ' + str(e), file=sys.stderr)
          JACOCO_PYEOF
            fi
            # Inject test dependencies via string insertion (preserves pom.xml structure)
            python3 <<'TESTDEPS_PYEOF' || true
          import json, sys, re
          try:
              stack = {}
              try:
                  with open('detected_stack.json') as f:
                      stack = json.load(f)
              except Exception:
                  pass

              test_fw = (stack.get('test_framework') or '').lower()
              java_ver_str = str(stack.get('version') or '17')
              try:
                  java_major = int(java_ver_str.split('.')[0])
              except (ValueError, IndexError):
                  java_major = 17

              with open('pom.xml', 'r') as f:
                  pom = f.read()

              # Detect Spring Boot version
              sb_version = stack.get('spring_boot_version') or ''
              if not sb_version:
                  m = re.search(
                      r'<parent>.*?<groupId>\s*org\.springframework\.boot\s*</groupId>'
                      r'.*?<version>\s*([\d.]+)\s*</version>.*?</parent>',
                      pom, re.DOTALL)
                  if m:
                      sb_version = m.group(1)
              if not sb_version:
                  m = re.search(r'<spring-boot\.version>\s*([\d.]+)\s*</spring-boot\.version>', pom)
                  if m:
                      sb_version = m.group(1)
              has_spring_boot = bool(sb_version) or 'spring-boot' in pom.lower()
              if has_spring_boot and not sb_version:
                  sb_version = '3.2.1'

              has_sb_parent = bool(re.search(
                  r'<parent>.*?<groupId>\s*org\.springframework\.boot\s*</groupId>.*?</parent>',
                  pom, re.DOTALL))

              # Build dependency list
              mockito_ver = '5.11.0' if java_major >= 11 else '4.11.0'
              needed = []
              if test_fw == 'testng':
                  needed.append(('org.testng', 'testng', '7.9.0'))
              elif test_fw == 'junit4':
                  needed.append(('junit', 'junit', '4.13.2'))
                  needed.append(('org.mockito', 'mockito-core', mockito_ver))
              else:
                  junit5_ver = '5.10.2' if java_major >= 11 else '5.9.3'
                  needed.append(('org.junit.jupiter', 'junit-jupiter', junit5_ver))
                  needed.append(('org.mockito', 'mockito-core', mockito_ver))
                  needed.append(('org.mockito', 'mockito-junit-jupiter', mockito_ver))
              if has_spring_boot:
                  # Always use explicit version — managed (no version) can fail to
                  # resolve transitives like spring-boot-test-autoconfigure
                  needed.append(('org.springframework.boot', 'spring-boot-starter-test', sb_version))
                  # spring-boot-test-autoconfigure contains @DataJpaTest, @WebMvcTest etc.
                  # It is a transitive of starter-test but may not resolve when version is managed
                  needed.append(('org.springframework.boot', 'spring-boot-test-autoconfigure', sb_version))
                  # H2 in-memory database for @DataJpaTest repository tests
                  needed.append(('com.h2database', 'h2', ''))
                  # Ensure spring-data-jpa is available for @DataJpaTest autoconfig
                  if 'spring-boot-starter-data-jpa' in pom:
                      needed.append(('org.springframework.boot', 'spring-boot-starter-data-jpa', sb_version))
                  # spring-data-jdbc is needed by DataJdbcTypeExcludeFilter (loaded by @DataJpaTest)
                  # Without it: NoClassDefFoundError: AbstractJdbcConfiguration
                  needed.append(('org.springframework.data', 'spring-data-jdbc', ''))

              # String-based injection: insert before </dependencies>
              # This preserves the original pom.xml structure (comments, formatting, etc.)
              NL = chr(10)
              added = []
              for gid, aid, ver in needed:
                  marker = '<artifactId>' + aid + '</artifactId>'
                  if marker in pom:
                      continue
                  ver_line = NL + '      <version>' + ver + '</version>' if ver else ''
                  snippet = (
                      NL + '    <dependency>'
                      + NL + '      <groupId>' + gid + '</groupId>'
                      + NL + '      <artifactId>' + aid + '</artifactId>'
                      + ver_line
                      + NL + '      <scope>test</scope>'
                      + NL + '    </dependency>')
                  # Insert before the last </dependencies>
                  idx = pom.rfind('</dependencies>')
                  if idx == -1:
                      idx = pom.rfind('</project>')
                      if idx == -1:
                          continue
                      pom = pom[:idx] + NL + '  <dependencies>' + snippet + NL + '  </dependencies>' + NL + pom[idx:]
                  else:
                      pom = pom[:idx] + snippet + NL + '  ' + pom[idx:]
                  added.append(aid + ':' + (ver or 'managed'))

              if added:
                  with open('pom.xml', 'w') as f:
                      f.write(pom)
                  print('Test deps injected (java=' + str(java_major) + ', fw=' + (test_fw or 'junit5') + ', sb=' + (sb_version or 'none') + '): ' + ', '.join(added))
              else:
                  print('All test deps already present')
          except Exception as e:
              print('Test dep injection skipped: ' + str(e), file=sys.stderr)
          TESTDEPS_PYEOF
            echo "--- pom.xml header after injection ---"
            head -3 pom.xml
            echo "--- pom.xml test dependencies ---"
            grep -B1 -A3 '<scope>test</scope>' pom.xml || echo "(no test-scoped deps)"
            echo "---"
            # Create application-test.properties for H2 in-memory DB (used by @DataJpaTest / @SpringBootTest)
            TEST_PROPS_DIR="src/test/resources"
            mkdir -p "$TEST_PROPS_DIR"
            if [ ! -f "$TEST_PROPS_DIR/application-test.properties" ]; then
              cat > "$TEST_PROPS_DIR/application-test.properties" <<'H2PROPS'
          spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          spring.datasource.driver-class-name=org.h2.Driver
          spring.datasource.username=sa
          spring.datasource.password=
          spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.flyway.enabled=false
          H2PROPS
              echo "Created application-test.properties with H2 datasource"
            fi
            # Fix missing imports and replace fragile annotations in generated test files
            python3 <<'IMPORTFIX_PYEOF' || true
          import os, sys
          NL = chr(10)

          # --- Phase 1: Replace fragile annotations with robust alternatives ---
          # @WebMvcTest without a controller class arg often fails to load context.
          # @DataJpaTest is kept — it works with H2 in-memory DB (injected below).
          REPLACEMENTS = [
              # (old_annotation, old_import_fragment, new_annotation, new_import)
              # Only replace @WebMvcTest (without class arg) as fallback
          ]

          # Map annotation/class usage markers to their required import statements
          KNOWN = [
              ('@ExtendWith',       'import org.junit.jupiter.api.extension.ExtendWith;'),
              ('MockitoExtension',  'import org.mockito.junit.jupiter.MockitoExtension;'),
              ('@Mock',             'import org.mockito.Mock;'),
              ('@InjectMocks',      'import org.mockito.InjectMocks;'),
              ('Mockito.',          'import org.mockito.Mockito;'),
              ('@MockBean',         'import org.springframework.boot.test.mock.mockito.MockBean;'),
              ('@SpringBootTest',   'import org.springframework.boot.test.context.SpringBootTest;'),
              ('@DataJpaTest',      'import org.springframework.boot.test.autoconfigure.orm.jpa.DataJpaTest;'),
              ('@ActiveProfiles',   'import org.springframework.test.context.ActiveProfiles;'),
              ('@AutoConfigureMockMvc', 'import org.springframework.boot.test.autoconfigure.web.servlet.AutoConfigureMockMvc;'),
              ('MockMvc ',          'import org.springframework.test.web.servlet.MockMvc;'),
              ('@Autowired',        'import org.springframework.beans.factory.annotation.Autowired;'),
              ('@Test',             'import org.junit.jupiter.api.Test;'),
              ('@BeforeEach',       'import org.junit.jupiter.api.BeforeEach;'),
              ('@AfterEach',        'import org.junit.jupiter.api.AfterEach;'),
              ('@DisplayName',      'import org.junit.jupiter.api.DisplayName;'),
              ('Assertions.',       'import org.junit.jupiter.api.Assertions;'),
              ('ArgumentCaptor',    'import org.mockito.ArgumentCaptor;'),
              ('@Captor',           'import org.mockito.Captor;'),
              ('@Transactional',    'import org.springframework.transaction.annotation.Transactional;'),
              ('TestEntityManager', 'import org.springframework.boot.test.autoconfigure.orm.jpa.TestEntityManager;'),
              ('@WebMvcTest',       'import org.springframework.boot.test.autoconfigure.web.servlet.WebMvcTest;'),
              ('ObjectMapper',      'import com.fasterxml.jackson.databind.ObjectMapper;'),
              # Common JDK types the LLM often forgets to import
              ('List<',             'import java.util.List;'),
              ('ArrayList<',        'import java.util.ArrayList;'),
              ('Map<',              'import java.util.Map;'),
              ('Optional<',         'import java.util.Optional;'),
              ('Arrays.',           'import java.util.Arrays;'),
              ('Collections.',      'import java.util.Collections;'),
              ('LocalDateTime',     'import java.time.LocalDateTime;'),
              ('LocalDate.',        'import java.time.LocalDate;'),
          ]

          # Phase 1b: Fix wrong assertion imports
          # LLM sometimes imports Spring's AssertionErrors instead of JUnit 5 Assertions
          WRONG_ASSERT_IMPORTS = [
              'import org.springframework.test.util.AssertionErrors',
              'import static org.springframework.test.util.AssertionErrors',
          ]
          CORRECT_ASSERT_IMPORT = 'import static org.junit.jupiter.api.Assertions.*;'

          fixed = 0
          test_dir = 'src/test/java'
          if not os.path.isdir(test_dir):
              print('No test directory found')
              sys.exit(0)
          for root, dirs, files in os.walk(test_dir):
              for fname in files:
                  if not fname.endswith('.java'):
                      continue
                  fpath = os.path.join(root, fname)
                  with open(fpath, 'r') as f:
                      content = f.read()
                  changed = False

                  # Phase 1a: Replace fragile annotations
                  for old_ann, old_imp_frag, new_ann, new_imp in REPLACEMENTS:
                      if old_ann in content:
                          content = content.replace(old_ann, new_ann)
                          # Remove old import line if present
                          new_lines = []
                          for line in content.split(NL):
                              if old_imp_frag in line and line.strip().startswith('import '):
                                  continue
                              new_lines.append(line)
                          content = NL.join(new_lines)
                          changed = True
                          print('Replaced ' + old_ann + ' -> ' + new_ann + ' in ' + fname)

                  # Phase 1b: Fix wrong assertion imports
                  for wrong in WRONG_ASSERT_IMPORTS:
                      if wrong in content:
                          new_lines = []
                          for line in content.split(NL):
                              if wrong in line and line.strip().startswith('import '):
                                  continue
                              new_lines.append(line)
                          content = NL.join(new_lines)
                          # Add correct static import if not present
                          if CORRECT_ASSERT_IMPORT not in content:
                              lines2 = content.split(NL)
                              idx2 = 0
                              for ii, ll in enumerate(lines2):
                                  if ll.startswith('package '):
                                      idx2 = ii + 1
                                      break
                              lines2.insert(idx2 + 1, CORRECT_ASSERT_IMPORT)
                              content = NL.join(lines2)
                          changed = True
                          print('Fixed assertion import in ' + fname)

                  # Phase 2: Add missing imports
                  missing = []
                  for marker, imp_line in KNOWN:
                      if marker in content and imp_line not in content:
                          missing.append(imp_line)
                  if missing:
                      lines = content.split(NL)
                      insert_idx = 0
                      for i, line in enumerate(lines):
                          if line.startswith('package '):
                              insert_idx = i + 1
                              break
                      for imp in sorted(missing):
                          lines.insert(insert_idx + 1, imp)
                      content = NL.join(lines)
                      changed = True
                      print('Fixed imports in ' + fname + ': ' + ', '.join(m.split('.')[-1].rstrip(';') for m in missing))

                  # Phase 3: Inject @ActiveProfiles("test") for Spring context tests
                  # This makes @DataJpaTest and @SpringBootTest use application-test.properties (H2)
                  needs_profile = ('@DataJpaTest' in content or '@SpringBootTest' in content)
                  has_profile = '@ActiveProfiles' in content
                  if needs_profile and not has_profile:
                      # Add annotation before the class declaration
                      lines3 = content.split(NL)
                      for ci, cl in enumerate(lines3):
                          stripped = cl.strip()
                          if stripped.startswith('public class ') or stripped.startswith('class '):
                              lines3.insert(ci, '@ActiveProfiles("test")')
                              break
                      content = NL.join(lines3)
                      # Add import if missing
                      ap_import = 'import org.springframework.test.context.ActiveProfiles;'
                      if ap_import not in content:
                          lines4 = content.split(NL)
                          pi = 0
                          for pi2, pl in enumerate(lines4):
                              if pl.startswith('package '):
                                  pi = pi2 + 1
                                  break
                          lines4.insert(pi + 1, ap_import)
                          content = NL.join(lines4)
                      changed = True
                      print('Added @ActiveProfiles("test") to ' + fname)

                  # Phase 4: Fix 'new ServiceImpl()' pattern in tests that have @Mock fields
                  # When a test has @Mock fields but instantiates the service with 'new',
                  # the mocks are never injected → NullPointerException on every call.
                  # Fix: replace 'new XxxServiceImpl(...)' with @InjectMocks field.
                  if '@Mock' in content and 'new ' in content and '@InjectMocks' not in content:
                      import re as _re
                      # Match: SomeServiceImpl svc = new SomeServiceImpl(...)
                      # or: SomeService svc = new SomeServiceImpl(...)
                      pat = _re.compile(
                          r'(\s+)((?:private|protected|public)\s+)?'
                          r'(\w+(?:Service|Facade|Manager|Handler|Processor)\w*)\s+'
                          r'(\w+)\s*=\s*new\s+\w+\([^)]*\)\s*;'
                      )
                      m = pat.search(content)
                      if m:
                          indent = m.group(1)
                          svc_type = m.group(3)
                          svc_name = m.group(4)
                          old_line = m.group(0)
                          new_line = indent + '@InjectMocks' + NL + indent + 'private ' + svc_type + ' ' + svc_name + ';'
                          content = content.replace(old_line, new_line)
                          # Remove setUp() that does 'svc = new ...'
                          setup_pat = _re.compile(
                              r'\s+@BeforeEach\s+void\s+setUp\(\)\s*\{[^}]*' + _re.escape(svc_name) + r'\s*=\s*new\s+\w+\([^)]*\)\s*;[^}]*\}'
                          )
                          content = setup_pat.sub('', content)
                          changed = True
                          print('Fixed new ServiceImpl() -> @InjectMocks in ' + fname)

                  if changed:
                      with open(fpath, 'w') as f:
                          f.write(content)
                      fixed += 1
          if fixed:
              print('Patched ' + str(fixed) + ' test file(s)')
          else:
              print('All test files OK')
          IMPORTFIX_PYEOF
            mvn dependency:resolve -DincludeScope=test 2>&1 | tail -20 || true
            # --- Compile-check-and-prune: remove test files that fail compilation ---
            # Uses Python to reliably parse javac error output and delete uncompilable test files.
            python3 <<'PRUNE_PYEOF' || true
          import subprocess, re, os, sys
          NL = chr(10)
          MAX_ATTEMPTS = 3
          test_dir = 'src/test/java'
          if not os.path.isdir(test_dir):
              print('No test directory, skipping compile check')
              sys.exit(0)
          for attempt in range(1, MAX_ATTEMPTS + 1):
              print('=== Compile check attempt ' + str(attempt) + ' ===')
              result = subprocess.run(
                  ['mvn', 'test-compile', '-q'],
                  capture_output=True, text=True, timeout=120
              )
              if result.returncode == 0:
                  print('Compilation succeeded')
                  break
              output = result.stdout + NL + result.stderr
              paths = set()
              for line in output.split(NL):
                  m = re.search(r'(/\S+\.java):\[', line)
                  if m:
                      paths.add(m.group(1))
              test_files = sorted(p for p in paths if '/src/test/' in p and os.path.isfile(p))
              if not test_files:
                  print('Compile failed but could not identify failing test files')
                  for ln in output.strip().split(NL)[-30:]:
                      print(ln)
                  break
              for f in test_files:
                  print('Removing uncompilable test: ' + f)
                  os.remove(f)
              remaining = 0
              for root, dirs, files in os.walk(test_dir):
                  remaining += sum(1 for fn in files if fn.endswith('.java'))
              if remaining == 0:
                  print('All test files removed - no compilable tests')
                  break
              print(str(remaining) + ' test file(s) remaining, retrying...')
          PRUNE_PYEOF
            # Run tests (only compilable files remain)
            mvn test
            # Collect JaCoCo coverage reports
            for JACOCO_PATH in target/site/jacoco/jacoco.xml target/jacoco.xml; do
              if [ -f "$JACOCO_PATH" ]; then
                cp "$JACOCO_PATH" pr-agent-artifacts/jacoco.xml
                break
              fi
            done
            # Parse coverage summary
            if [ -f pr-agent-artifacts/jacoco.xml ]; then
              python3 <<'COV_PYEOF' || true
          import xml.etree.ElementTree as ET, json, os
          try:
              tree = ET.parse('pr-agent-artifacts/jacoco.xml')
              root = tree.getroot()
              counters = {}
              for c in root.findall('.//counter'):
                  t = c.get('type','')
                  missed = int(c.get('missed','0'))
                  covered = int(c.get('covered','0'))
                  total = missed + covered
                  counters[t.lower()] = {'covered': covered, 'missed': missed, 'total': total, 'pct': round(covered/total*100,1) if total else 0}
              with open('pr-agent-artifacts/coverage-summary.json','w') as f:
                  json.dump(counters, f)
              line = counters.get('line',{})
              branch = counters.get('branch',{})
              print(f"Coverage: lines={line.get('pct',0)}% branches={branch.get('pct',0)}%")
          except Exception as e:
              print(f'Coverage parse skipped: {e}')
          COV_PYEOF
            fi
          elif [ "$LANG" = "node" ]; then
            npm ci
            npm test -- --coverage || npm test || true
            if [ -f coverage/coverage-final.json ]; then
              cp coverage/coverage-final.json pr-agent-artifacts/istanbul.json
            fi
          elif [ "$LANG" = "python" ]; then
            python -m pip install -r requirements.txt || true
            pytest --maxfail=1 --disable-warnings -q --cov --cov-report=xml || pytest -q || true
            if [ -f coverage.xml ]; then
              cp coverage.xml pr-agent-artifacts/coverage.xml
            fi
          else
            echo "Unknown language '$LANG'" >&2
            exit 2
          fi

      - name: Upload artifacts to S3
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_KEY="pr-agent/${{ inputs.agent_run_id }}/artifacts"
          ARTIFACT_OBJECT_KEY="$ARTIFACT_KEY/pr-agent-artifacts.tgz"
          echo "artifact_key=$ARTIFACT_KEY" >> $GITHUB_OUTPUT
          echo "artifact_object_key=$ARTIFACT_OBJECT_KEY" >> $GITHUB_OUTPUT
          tar -czf pr-agent-artifacts.tgz -C pr-agent-artifacts .
          aws s3 cp pr-agent-artifacts.tgz "s3://${{ secrets.PR_AGENT_S3_BUCKET }}/$ARTIFACT_OBJECT_KEY"

      - name: Build callback payload
        if: always()
        id: callback_payload
        shell: bash
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi
          python3 - "$STATUS" <<'PYEOF'
          import json, os, sys
          status = sys.argv[1] if len(sys.argv) > 1 else "failure"
          raw = os.environ.get('DETECTED_STACK', '{}')
          try:
              ds = json.loads(raw) if raw else {}
          except Exception:
              ds = {"raw": raw}
          # Load coverage summary if available
          cov = {}
          try:
              with open('pr-agent-artifacts/coverage-summary.json') as cf:
                  cov = json.load(cf)
          except Exception:
              pass
          body = json.dumps({
              "agent_run_id": os.environ.get('RUN_ID', ''),
              "pr_number": os.environ.get('PR_NUM', ''),
              "head_sha": os.environ.get('HEAD_SHA', ''),
              "status": status,
              "artifact_key": os.environ.get('ART_KEY', ''),
              "artifact_bucket": os.environ.get('ART_BUCKET', ''),
              "artifact_object_key": os.environ.get('ART_OBJ_KEY', ''),
              "detected_stack": ds,
              "coverage": cov,
          })
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'body={body}\n')
          PYEOF
        env:
          RUN_ID: "${{ inputs.agent_run_id }}"
          PR_NUM: "${{ inputs.pr_number }}"
          HEAD_SHA: "${{ inputs.head_sha }}"
          ART_KEY: "${{ steps.upload.outputs.artifact_key }}"
          ART_BUCKET: "${{ secrets.PR_AGENT_S3_BUCKET }}"
          ART_OBJ_KEY: "${{ steps.upload.outputs.artifact_object_key }}"
          DETECTED_STACK: "${{ inputs.detected_stack }}"

      - name: Callback to PR Agent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BODY='${{ steps.callback_payload.outputs.body }}'
          SIG=$(echo -n "$BODY" | python3 -c "
          import hmac, hashlib, os, sys
          secret = os.environ['CALLBACK_SECRET'].encode()
          body = sys.stdin.read().encode()
          print(hmac.new(secret, body, hashlib.sha256).hexdigest())
          ")
          curl -sS -X POST             -H "Content-Type: application/json"             -H "X-PR-Agent-Signature: sha256=$SIG"             --data-binary "$BODY"             "https://7jsur28fwi.execute-api.us-east-1.amazonaws.com/workflow-callback"
        env:
          CALLBACK_SECRET: "${{ secrets.PR_AGENT_CALLBACK_SECRET }}"
