name: PR Agent Tests

"on":
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull Request number
        required: true
        type: string
      head_sha:
        description: PR head sha
        required: true
        type: string
      agent_run_id:
        description: Agent run id
        required: true
        type: string
      detected_stack:
        description: JSON string describing detected stack
        required: true
        type: string
      env_policy_modes:
        description: JSON string of resolved environment policy modes
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  PR_AGENT_TEMPLATE_VERSION: "64"

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}

      - name: Parse detected stack
        id: stack
        shell: bash
        run: |
          echo "detected_stack=${DETECTED_STACK}" >> $GITHUB_OUTPUT
          echo "lang=$(python3 -c "import json,os; print(json.loads(os.environ['DETECTED_STACK']).get('language',''))")" >> $GITHUB_OUTPUT
        env:
          DETECTED_STACK: "${{ inputs.detected_stack }}"

      - name: Detect Java version from pom.xml
        if: ${{ steps.stack.outputs.lang == 'java' || steps.stack.outputs.lang == 'kotlin' }}
        id: java_version
        shell: bash
        run: |
          JAVA_VER=""
          if [ -f pom.xml ]; then
            # Try maven.compiler.release, maven.compiler.source, java.version
            for TAG in maven.compiler.release maven.compiler.source java.version; do
              VAL=$(sed -n "s/.*<${TAG}>\\([^<]*\\)<.*/\\1/p" pom.xml 2>/dev/null | head -1)
              if [ -n "$VAL" ]; then
                JAVA_VER="$VAL"
                break
              fi
            done
          fi
          # Gradle: check build.gradle.kts or build.gradle for toolchain / sourceCompatibility
          if [ -z "$JAVA_VER" ]; then
            for GRADLE_FILE in build.gradle.kts build.gradle; do
              if [ -f "$GRADLE_FILE" ]; then
                # Gradle toolchain: JavaLanguageVersion.of(17)
                VAL=$(sed -n 's/.*JavaLanguageVersion\.of(\([0-9]*\)).*/\1/p' "$GRADLE_FILE" 2>/dev/null | head -1)
                if [ -n "$VAL" ]; then
                  JAVA_VER="$VAL"
                  break
                fi
                # sourceCompatibility = JavaVersion.VERSION_17 or '17' or 17
                VAL=$(sed -n 's/.*sourceCompatibility[[:space:]]*=[[:space:]]*[^0-9]*\([0-9][0-9]*\).*/\1/p' "$GRADLE_FILE" 2>/dev/null | head -1)
                if [ -n "$VAL" ]; then
                  JAVA_VER="$VAL"
                  break
                fi
                # kotlin jvmTarget: jvmTarget = "17"
                VAL=$(sed -n 's/.*jvmTarget[[:space:]]*=[[:space:]]*"\([0-9.]*\)".*/\1/p' "$GRADLE_FILE" 2>/dev/null | head -1)
                if [ -n "$VAL" ]; then
                  JAVA_VER="$VAL"
                  break
                fi
              fi
            done
          fi
          # Default to 17 if not detected (widely compatible)
          if [ -z "$JAVA_VER" ]; then
            JAVA_VER="17"
          fi
          # Normalize: "1.8" -> "8"
          if [[ "$JAVA_VER" == 1.* ]]; then
            JAVA_VER="${JAVA_VER#1.}"
          fi
          # Normalize VERSION_17-style identifiers
          JAVA_VER=$(echo "$JAVA_VER" | sed 's/[^0-9].*//' | head -1 || echo "17")
          echo "version=$JAVA_VER" >> $GITHUB_OUTPUT
          echo "Detected Java version: $JAVA_VER"

      - name: Detect Gradle framework flag
        if: ${{ steps.stack.outputs.lang == 'java' || steps.stack.outputs.lang == 'kotlin' }}
        id: build_tool
        shell: bash
        run: |
          FRAMEWORK=$(python3 -c "import json,os; print(json.loads(os.environ['DETECTED_STACK']).get('framework','maven'))")
          echo "framework=$FRAMEWORK" >> $GITHUB_OUTPUT
        env:
          DETECTED_STACK: "${{ inputs.detected_stack }}"

      - name: Setup Java (Temurin) — Maven
        if: ${{ (steps.stack.outputs.lang == 'java' || steps.stack.outputs.lang == 'kotlin') && steps.build_tool.outputs.framework == 'maven' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java_version.outputs.version }}
          cache: maven

      - name: Setup Java (Temurin) — Gradle
        if: ${{ (steps.stack.outputs.lang == 'java' || steps.stack.outputs.lang == 'kotlin') && steps.build_tool.outputs.framework == 'gradle' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.java_version.outputs.version }}
          cache: gradle

      - name: Setup Node
        if: ${{ steps.stack.outputs.lang == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        if: ${{ steps.stack.outputs.lang == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PR_AGENT_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Prepare test environment
        shell: bash
        run: |
          set -euo pipefail
          echo "${DETECTED_STACK}" > detected_stack.json
          echo "${ENV_POLICY_MODES:-{}}" > env_policy_modes.json
          mkdir -p pr-agent-artifacts
        env:
          DETECTED_STACK: "${{ inputs.detected_stack }}"
          ENV_POLICY_MODES: "${{ inputs.env_policy_modes }}"

      - name: Inject Gradle test dependencies
        if: ${{ (steps.stack.outputs.lang == 'java' || steps.stack.outputs.lang == 'kotlin') && steps.build_tool.outputs.framework == 'gradle' }}
        shell: bash
        run: |
          set -euo pipefail
          # Make gradlew executable (may be committed without +x)
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi
          # Inject test dependencies into build.gradle or build.gradle.kts
          python3 <<'GRADLE_DEPS_PYEOF' || true
          import sys, re, os
          LANG = os.environ.get('PR_AGENT_LANG', 'java')
          is_kotlin_dsl = os.path.exists('build.gradle.kts')
          gradle_file = 'build.gradle.kts' if is_kotlin_dsl else 'build.gradle'
          if not os.path.exists(gradle_file):
              print('No build.gradle / build.gradle.kts found, skipping dep injection')
              sys.exit(0)
          with open(gradle_file, 'r') as f:
              content = f.read()
          # Determine JUnit5 / MockK versions based on language
          junit5_ver = '5.10.2'
          mockk_ver = '1.13.10'
          deps_to_add = []
          if LANG == 'kotlin':
              # Kotlin: JUnit 5 + MockK
              if 'junit-jupiter' not in content and 'junit5' not in content.lower():
                  if is_kotlin_dsl:
                      deps_to_add.append(f'    testImplementation("org.junit.jupiter:junit-jupiter:{junit5_ver}")')
                      deps_to_add.append(f'    testImplementation("io.mockk:mockk:{mockk_ver}")')
                  else:
                      deps_to_add.append(f"    testImplementation 'org.junit.jupiter:junit-jupiter:{junit5_ver}'")
                      deps_to_add.append(f"    testImplementation 'io.mockk:mockk:{mockk_ver}'")
          else:
              # Java: JUnit 5 + Mockito
              mockito_ver = '5.11.0'
              if 'junit-jupiter' not in content:
                  if is_kotlin_dsl:
                      deps_to_add.append(f'    testImplementation("org.junit.jupiter:junit-jupiter:{junit5_ver}")')
                      deps_to_add.append(f'    testImplementation("org.mockito:mockito-core:{mockito_ver}")')
                      deps_to_add.append(f'    testImplementation("org.mockito:mockito-junit-jupiter:{mockito_ver}")')
                  else:
                      deps_to_add.append(f"    testImplementation 'org.junit.jupiter:junit-jupiter:{junit5_ver}'")
                      deps_to_add.append(f"    testImplementation 'org.mockito:mockito-core:{mockito_ver}'")
                      deps_to_add.append(f"    testImplementation 'org.mockito:mockito-junit-jupiter:{mockito_ver}'")
          # Spring Boot: inject spring-boot-starter-test
          if 'springframework.boot' in content and 'spring-boot-starter-test' not in content:
              # Detect spring boot version from build file (plugins block)
              sb_m = re.search(r'id\s*["\(]org\.springframework\.boot["\)][^"]*["\']([\d.]+)["\']', content)
              sb_ver = sb_m.group(1) if sb_m else '3.2.1'
              if is_kotlin_dsl:
                  deps_to_add.append(f'    testImplementation("org.springframework.boot:spring-boot-starter-test:{sb_ver}")')
              else:
                  deps_to_add.append(f"    testImplementation 'org.springframework.boot:spring-boot-starter-test:{sb_ver}'")
          # Add JaCoCo plugin if not present
          jacoco_plugin = 'jacoco' if not is_kotlin_dsl else 'jacoco'
          if jacoco_plugin not in content:
              if is_kotlin_dsl:
                  content = re.sub(
                      r'(plugins\s*\{)',
                      r'\1\n    id("jacoco")',
                      content, count=1
                  )
              else:
                  content = re.sub(
                      r'(plugins\s*\{)',
                      r'\1\n    id \'jacoco\'',
                      content, count=1
                  )
              print('JaCoCo plugin added')
          # Add useJUnitPlatform() if not present (required for JUnit 5)
          if 'useJUnitPlatform' not in content:
              if is_kotlin_dsl:
                  content += '\ntasks.test { useJUnitPlatform() }\n'
              else:
                  content += '\ntest { useJUnitPlatform() }\n'
              print('useJUnitPlatform() added')
          if deps_to_add:
              deps_block = '\n'.join(deps_to_add)
              # Find existing dependencies block and append inside it
              m = re.search(r'(dependencies\s*\{)', content)
              if m:
                  insert_at = m.end()
                  content = content[:insert_at] + '\n' + deps_block + content[insert_at:]
              else:
                  content += '\ndependencies {\n' + deps_block + '\n}\n'
              print(f'Injected {len(deps_to_add)} test deps into {gradle_file}')
          with open(gradle_file, 'w') as f:
              f.write(content)
          GRADLE_DEPS_PYEOF
        env:
          PR_AGENT_LANG: "${{ steps.stack.outputs.lang }}"

      - name: Inject Java test dependencies
        if: ${{ (steps.stack.outputs.lang == 'java') && steps.build_tool.outputs.framework == 'maven' }}
        shell: bash
        run: |
          set -euo pipefail
          # Inject JaCoCo plugin via string insertion (preserves pom.xml structure)
          if ! grep -q 'jacoco-maven-plugin' pom.xml 2>/dev/null; then
            python3 <<'JACOCO_PYEOF' || true
          import sys
          try:
              with open('pom.xml', 'r') as f:
                  pom = f.read()
              NL = chr(10)
              plugin_xml = (
                  NL + '      <plugin>'
                  + NL + '        <groupId>org.jacoco</groupId>'
                  + NL + '        <artifactId>jacoco-maven-plugin</artifactId>'
                  + NL + '        <version>0.8.11</version>'
                  + NL + '        <executions>'
                  + NL + '          <execution>'
                  + NL + '            <id>prepare-agent</id>'
                  + NL + '            <goals><goal>prepare-agent</goal></goals>'
                  + NL + '            <phase>initialize</phase>'
                  + NL + '          </execution>'
                  + NL + '          <execution>'
                  + NL + '            <id>report</id>'
                  + NL + '            <goals><goal>report</goal></goals>'
                  + NL + '            <phase>test</phase>'
                  + NL + '          </execution>'
                  + NL + '        </executions>'
                  + NL + '      </plugin>')
              idx = pom.rfind('</plugins>')
              if idx != -1:
                  pom = pom[:idx] + plugin_xml + NL + '    ' + pom[idx:]
              else:
                  idx = pom.rfind('</build>')
                  if idx != -1:
                      pom = pom[:idx] + '  <plugins>' + plugin_xml + NL + '    </plugins>' + NL + '  ' + pom[idx:]
                  else:
                      idx = pom.rfind('</project>')
                      if idx != -1:
                          pom = pom[:idx] + '  <build>' + NL + '    <plugins>' + plugin_xml + NL + '    </plugins>' + NL + '  </build>' + NL + pom[idx:]
              with open('pom.xml', 'w') as f:
                  f.write(pom)
              print('JaCoCo plugin injected')
          except Exception as e:
              print('JaCoCo injection skipped: ' + str(e), file=sys.stderr)
          JACOCO_PYEOF
            fi
            # Inject test dependencies via string insertion (preserves pom.xml structure)
            python3 <<'TESTDEPS_PYEOF' || true
          import json, sys, re
          try:
              stack = {}
              try:
                  with open('detected_stack.json') as f:
                      stack = json.load(f)
              except Exception:
                  pass

              test_fw = (stack.get('test_framework') or '').lower()
              java_ver_str = str(stack.get('version') or '17')
              try:
                  java_major = int(java_ver_str.split('.')[0])
              except (ValueError, IndexError):
                  java_major = 17

              with open('pom.xml', 'r') as f:
                  pom = f.read()

              # Detect Spring Boot version
              sb_version = stack.get('spring_boot_version') or ''
              if not sb_version:
                  m = re.search(
                      r'<parent>.*?<groupId>\s*org\.springframework\.boot\s*</groupId>'
                      r'.*?<version>\s*([\d.]+)\s*</version>.*?</parent>',
                      pom, re.DOTALL)
                  if m:
                      sb_version = m.group(1)
              if not sb_version:
                  m = re.search(r'<spring-boot\.version>\s*([\d.]+)\s*</spring-boot\.version>', pom)
                  if m:
                      sb_version = m.group(1)
              has_spring_boot = bool(sb_version) or 'spring-boot' in pom.lower()
              if has_spring_boot and not sb_version:
                  sb_version = '3.2.1'

              has_sb_parent = bool(re.search(
                  r'<parent>.*?<groupId>\s*org\.springframework\.boot\s*</groupId>.*?</parent>',
                  pom, re.DOTALL))

              # Build dependency list
              mockito_ver = '5.11.0' if java_major >= 11 else '4.11.0'
              needed = []
              if test_fw == 'testng':
                  needed.append(('org.testng', 'testng', '7.9.0'))
              elif test_fw == 'junit4':
                  needed.append(('junit', 'junit', '4.13.2'))
                  needed.append(('org.mockito', 'mockito-core', mockito_ver))
              else:
                  junit5_ver = '5.10.2' if java_major >= 11 else '5.9.3'
                  needed.append(('org.junit.jupiter', 'junit-jupiter', junit5_ver))
                  needed.append(('org.mockito', 'mockito-core', mockito_ver))
                  needed.append(('org.mockito', 'mockito-junit-jupiter', mockito_ver))
              if has_spring_boot:
                  # Always use explicit version — managed (no version) can fail to
                  # resolve transitives like spring-boot-test-autoconfigure
                  needed.append(('org.springframework.boot', 'spring-boot-starter-test', sb_version))
                  # spring-boot-test-autoconfigure contains @DataJpaTest, @WebMvcTest etc.
                  # It is a transitive of starter-test but may not resolve when version is managed
                  needed.append(('org.springframework.boot', 'spring-boot-test-autoconfigure', sb_version))
                  # H2 + spring-data-jdbc only needed when project uses JPA (for @DataJpaTest)
                  has_data_jpa = 'spring-boot-starter-data-jpa' in pom or 'spring-data-jpa' in pom
                  if has_data_jpa:
                      # H2 in-memory database for @DataJpaTest repository tests
                      needed.append(('com.h2database', 'h2', ''))
                      needed.append(('org.springframework.boot', 'spring-boot-starter-data-jpa', sb_version))
                      # spring-data-jdbc needed by DataJdbcTypeExcludeFilter (loaded by @DataJpaTest)
                      # Without it: NoClassDefFoundError: AbstractJdbcConfiguration
                      # Use starter to get proper version management from Spring Boot BOM
                      needed.append(('org.springframework.boot', 'spring-boot-starter-data-jdbc', sb_version))

              # Testcontainers for @SpringBootTest integration tests
              # Only inject if any *IntegrationTest.java files exist in the test tree
              has_integration_tests = False
              for root, dirs, files in __import__('os').walk('src/test/java'):
                  if any(f.endswith('IntegrationTest.java') for f in files):
                      has_integration_tests = True
                      break
              if has_integration_tests:
                  tc_ver = '1.19.7'
                  needed.append(('org.testcontainers', 'testcontainers', tc_ver))
                  needed.append(('org.testcontainers', 'junit-jupiter', tc_ver))
                  # DB flavor detection: inject the correct Testcontainers DB module
                  # based on which DB driver is declared in pom.xml rather than always
                  # defaulting to PostgreSQL (which causes failures on MySQL/MongoDB/Oracle repos).
                  pom_lower = pom.lower()
                  if 'mysql-connector' in pom_lower or 'mysql:mysql' in pom_lower:
                      needed.append(('org.testcontainers', 'mysql', tc_ver))
                  elif 'mariadb' in pom_lower:
                      needed.append(('org.testcontainers', 'mariadb', tc_ver))
                  elif 'mongodb' in pom_lower or 'spring-boot-starter-data-mongodb' in pom_lower:
                      needed.append(('org.testcontainers', 'mongodb', tc_ver))
                  elif 'ojdbc' in pom_lower or 'oracle.database' in pom_lower or 'com.oracle' in pom_lower:
                      needed.append(('org.testcontainers', 'oracle-xe', tc_ver))
                  else:
                      # Default: PostgreSQL (covers Spring Boot repos with spring-boot-starter-data-jpa
                      # and no explicit DB driver, which conventionally use PostgreSQL in prod)
                      needed.append(('org.testcontainers', 'postgresql', tc_ver))
                  if has_spring_boot:
                      needed.append(('org.springframework.boot', 'spring-boot-testcontainers', sb_version))
                  # ADR-022: WireMock for external HTTP service mocking
                  wm_ver = '3.5.4'
                  needed.append(('org.wiremock', 'wiremock-standalone', wm_ver))

                  # E-002: spring-kafka-test for @EmbeddedKafka support
                  has_kafka = 'kafka' in pom.lower() or 'KafkaTemplate' in pom or 'KafkaListener' in pom
                  if has_kafka and has_spring_boot:
                      needed.append(('org.springframework.kafka', 'spring-kafka-test', ''))

              # String-based injection: insert before </dependencies>
              # This preserves the original pom.xml structure (comments, formatting, etc.)
              NL = chr(10)
              added = []
              for gid, aid, ver in needed:
                  marker = '<artifactId>' + aid + '</artifactId>'
                  if marker in pom:
                      continue
                  ver_line = NL + '      <version>' + ver + '</version>' if ver else ''
                  snippet = (
                      NL + '    <dependency>'
                      + NL + '      <groupId>' + gid + '</groupId>'
                      + NL + '      <artifactId>' + aid + '</artifactId>'
                      + ver_line
                      + NL + '      <scope>test</scope>'
                      + NL + '    </dependency>')
                  # Insert before the last </dependencies>
                  idx = pom.rfind('</dependencies>')
                  if idx == -1:
                      idx = pom.rfind('</project>')
                      if idx == -1:
                          continue
                      pom = pom[:idx] + NL + '  <dependencies>' + snippet + NL + '  </dependencies>' + NL + pom[idx:]
                  else:
                      pom = pom[:idx] + snippet + NL + '  ' + pom[idx:]
                  added.append(aid + ':' + (ver or 'managed'))

              if added:
                  with open('pom.xml', 'w') as f:
                      f.write(pom)
                  print('Test deps injected (java=' + str(java_major) + ', fw=' + (test_fw or 'junit5') + ', sb=' + (sb_version or 'none') + '): ' + ', '.join(added))
              else:
                  print('All test deps already present')
          except Exception as e:
              print('Test dep injection skipped: ' + str(e), file=sys.stderr)
          TESTDEPS_PYEOF
            echo "--- pom.xml header after injection ---"
            head -3 pom.xml
            echo "--- pom.xml test dependencies ---"
            grep -B1 -A3 '<scope>test</scope>' pom.xml || echo "(no test-scoped deps)"
            echo "---"
            # Create / merge application.properties in test resources to override main DB config for ALL tests.
            # Merge-mode: if the file exists but points to a non-H2 datasource, overwrite the datasource
            # block rather than skipping — prevents CI failures when repos already have a PostgreSQL/MySQL
            # config committed to src/test/resources.
            TEST_PROPS_DIR="src/test/resources"
            mkdir -p "$TEST_PROPS_DIR"
            python3 <<'H2MERGE_PYEOF' || true
          import os, re
          props_path = 'src/test/resources/application.properties'
          H2_URL = 'spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE'
          H2_BLOCK = (
              'spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE\n'
              'spring.datasource.driver-class-name=org.h2.Driver\n'
              'spring.datasource.username=sa\n'
              'spring.datasource.password=\n'
              'spring.jpa.database-platform=org.hibernate.dialect.H2Dialect\n'
              'spring.jpa.hibernate.ddl-auto=create-drop\n'
              'spring.flyway.enabled=false\n'
          )
          if not os.path.exists(props_path):
              with open(props_path, 'w') as f:
                  f.write(H2_BLOCK)
              print('Created ' + props_path + ' with H2 datasource')
          else:
              content = open(props_path).read()
              if 'jdbc:h2' in content:
                  print(props_path + ' already uses H2 — no changes needed')
              else:
                  # File exists but points to a real DB: overwrite datasource lines only,
                  # preserve any other app config (logging, features, etc.)
                  # Remove existing spring.datasource.* and spring.jpa.* and spring.flyway.* lines
                  cleaned = re.sub(r'^spring\.(datasource|jpa|flyway)\.[^\n]*\n?', '', content, flags=re.MULTILINE)
                  merged = H2_BLOCK + '\n' + cleaned.strip() + '\n'
                  with open(props_path, 'w') as f:
                      f.write(merged)
                  print('Merged H2 datasource into existing ' + props_path + ' (overrode non-H2 config)')
          H2MERGE_PYEOF
            # Also create application-test.properties for tests using @ActiveProfiles("test")
            if [ ! -f "$TEST_PROPS_DIR/application-test.properties" ]; then
              cp "$TEST_PROPS_DIR/application.properties" "$TEST_PROPS_DIR/application-test.properties"
              echo "Created application-test.properties (copy of H2 config)"
            else
              # Merge H2 into application-test.properties if it also points to a non-H2 datasource
              python3 <<'H2MERGE_TEST_PYEOF' || true
          import os, re
          props_path = 'src/test/resources/application-test.properties'
          H2_BLOCK = (
              'spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE\n'
              'spring.datasource.driver-class-name=org.h2.Driver\n'
              'spring.datasource.username=sa\n'
              'spring.datasource.password=\n'
              'spring.jpa.database-platform=org.hibernate.dialect.H2Dialect\n'
              'spring.jpa.hibernate.ddl-auto=create-drop\n'
              'spring.flyway.enabled=false\n'
          )
          content = open(props_path).read()
          if 'jdbc:h2' not in content:
              cleaned = re.sub(r'^spring\.(datasource|jpa|flyway)\.[^\n]*\n?', '', content, flags=re.MULTILINE)
              merged = H2_BLOCK + '\n' + cleaned.strip() + '\n'
              with open(props_path, 'w') as f:
                  f.write(merged)
              print('Merged H2 datasource into existing ' + props_path)
          H2MERGE_TEST_PYEOF
            fi
            # Docker verification for Testcontainers integration tests.
            # SKIP_INTEGRATION=true when Docker is unavailable — Phase C is skipped entirely
            # rather than running @Testcontainers tests that will always fail without Docker,
            # which would consume self-heal attempts on an infra issue.
            SKIP_INTEGRATION=false
            HAS_INTEGRATION=$(find src/test/java -name '*IntegrationTest.java' -print -quit 2>/dev/null || true)
            if [ -n "$HAS_INTEGRATION" ]; then
              echo "--- Integration tests detected: verifying Docker ---"
              if docker info >/dev/null 2>&1; then
                echo "Docker is available — Testcontainers will work"
                # Set Testcontainers reuse flag for faster container startup
                mkdir -p "$HOME/.testcontainers"
                echo "testcontainers.reuse.enable=true" >> "$HOME/.testcontainers/.testcontainers.properties" 2>/dev/null || true
              else
                echo "Docker NOT available — skipping Phase C integration tests (SKIP_INTEGRATION=true)"
                echo "To enable integration tests, ensure the runner has Docker-in-Docker or use a self-hosted runner."
                SKIP_INTEGRATION=true
              fi
            fi
          mvn dependency:resolve -DincludeScope=test 2>&1 | tail -20 || true

      - name: Run tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          LANG=$(python3 -c "import json; print(json.load(open('detected_stack.json')).get('language',''))")

          FRAMEWORK=$(python3 -c "import json; print(json.load(open('detected_stack.json')).get('framework','maven'))")

          if [ "$LANG" = "java" ] && [ "$FRAMEWORK" = "gradle" ]; then
            [ ! -f gradlew ] && { echo 'gradlew not found'; exit 1; }
            chmod +x gradlew
            GRADLE_RC=0; UNIT_RC=0; FUNC_RC=0; INT_RC=0
            echo '=== Gradle Phase A: Unit ===' 
            ./gradlew test --tests '*Test' --tests '!*FunctionalTest' --tests '!*IntegrationTest' \
              --continue -x javadoc 2>&1 | tee pr-agent-artifacts/gradle-unit.log || UNIT_RC=$?
            echo '=== Gradle Phase B: Functional ==='
            ./gradlew test --tests '*FunctionalTest' \
              --continue -x javadoc 2>&1 | tee pr-agent-artifacts/gradle-functional.log || FUNC_RC=$?
            SKIP_INTEGRATION=false
            HAS_INT=$(find src/test -name '*IntegrationTest.*' -print -quit 2>/dev/null || true)
            [ -n "$HAS_INT" ] && ! docker info >/dev/null 2>&1 && SKIP_INTEGRATION=true
            if [ "${SKIP_INTEGRATION:-false}" != "true" ]; then
              echo '=== Gradle Phase C: Integration ==='
              ./gradlew test --tests '*IntegrationTest' \
                --continue -x javadoc 2>&1 | tee pr-agent-artifacts/gradle-integration.log || INT_RC=$?
            fi
            JACOCO_XML=build/reports/jacoco/test/jacocoTestReport.xml
            [ -f "$JACOCO_XML" ] && cp "$JACOCO_XML" pr-agent-artifacts/jacoco.xml || true
            if [ ! -f pr-agent-artifacts/jacoco.xml ] && [ -f build/jacoco/test.exec ]; then
              ./gradlew jacocoTestReport 2>/dev/null || true
              [ -f "$JACOCO_XML" ] && cp "$JACOCO_XML" pr-agent-artifacts/jacoco.xml || true
            fi
            find build/test-results -name '*.xml' -exec grep -l 'failure\|error' {} \; 2>/dev/null | \
              xargs grep -h 'message\|type' 2>/dev/null | head -200 > pr-agent-artifacts/surefire-errors.txt || true
            [ $UNIT_RC -ne 0 ] && GRADLE_RC=$UNIT_RC || true
            [ $FUNC_RC -ne 0 ] && GRADLE_RC=$FUNC_RC || true
            [ $INT_RC -ne 0 ] && GRADLE_RC=$INT_RC || true
            exit $GRADLE_RC

          elif [ "$LANG" = "kotlin" ] && [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew test --continue 2>&1 | tee pr-agent-artifacts/gradle-unit.log || true
            JACOCO_XML=build/reports/jacoco/test/jacocoTestReport.xml
            [ -f "$JACOCO_XML" ] && cp "$JACOCO_XML" pr-agent-artifacts/jacoco.xml || true
            exit 0
          fi

          if [ "$LANG" = "java" ]; then
            # --- Compile-check-and-prune: remove test files that fail compilation ---
            # Uses Python to reliably parse javac error output and delete uncompilable test files.
            python3 <<'PRUNE_PYEOF' || true
          import subprocess, re, os, sys, json
          NL = chr(10)
          MAX_ATTEMPTS = 3
          test_dir = 'src/test/java'
          compile_errors = []
          pruned_files = []
          if not os.path.isdir(test_dir):
              print('No test directory, skipping compile check')
              sys.exit(0)
          for attempt in range(1, MAX_ATTEMPTS + 1):
              print('=== Compile check attempt ' + str(attempt) + ' ===')
              result = subprocess.run(
                  ['mvn', 'test-compile', '-q'],
                  capture_output=True, text=True, timeout=120
              )
              if result.returncode == 0:
                  print('Compilation succeeded')
                  break
              output = result.stdout + NL + result.stderr
              compile_errors.append(output[-4000:])
              paths = set()
              for line in output.split(NL):
                  m = re.search(r'(/\S+\.java):\[', line)
                  if m:
                      paths.add(m.group(1))
              test_files = sorted(p for p in paths if '/src/test/' in p and os.path.isfile(p))
              if not test_files:
                  print('Compile failed but could not identify failing test files')
                  for ln in output.strip().split(NL)[-30:]:
                      print(ln)
                  break
              for f in test_files:
                  print('Removing uncompilable test: ' + f)
                  pruned_files.append(os.path.basename(f))
                  os.remove(f)
              remaining = 0
              for root, dirs, files in os.walk(test_dir):
                  remaining += sum(1 for fn in files if fn.endswith('.java'))
              if remaining == 0:
                  print('All test files removed - no compilable tests')
                  break
              print(str(remaining) + ' test file(s) remaining, retrying...')
          # Save compile errors for callback (Phase 2 — self-heal needs these)
          if compile_errors or pruned_files:
              report = {'pruned_files': pruned_files, 'compile_output': NL.join(compile_errors)[-8000:]}
              with open('pr-agent-artifacts/compile-errors.json', 'w') as cf:
                  json.dump(report, cf)
              with open('pr-agent-artifacts/compile-errors.txt', 'w') as cf:
                  if pruned_files:
                      cf.write('Pruned ' + str(len(pruned_files)) + ' uncompilable test files: ' + ', '.join(pruned_files) + NL)
                  cf.write(NL.join(compile_errors)[-8000:])
          PRUNE_PYEOF
            # Multi-module Maven detection: if pom.xml declares <modules>, collect child modules
            # that have src/test/java trees and pass -pl to restrict execution to those modules.
            # Single-module repos use the default (run from root).
            MVN_PL_FLAG=""
            python3 <<'MULTIMOD_PYEOF' || true
          import xml.etree.ElementTree as ET, os, sys
          try:
              tree = ET.parse('pom.xml')
              ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
              root = tree.getroot()
              # Support both namespaced and non-namespaced pom.xml files
              modules_el = root.find('m:modules', ns) or root.find('modules')
              if modules_el is None:
                  sys.exit(0)
              module_els = modules_el.findall('m:module', ns) or modules_el.findall('module')
              modules = [m.text.strip() for m in module_els if m.text and m.text.strip()]
              if not modules:
                  sys.exit(0)
              # Only target modules that actually have test sources
              test_modules = [m for m in modules if os.path.isdir(os.path.join(m, 'src', 'test', 'java'))]
              if not test_modules:
                  print('Multi-module repo detected but no modules have src/test/java — running from root')
                  sys.exit(0)
              pl_value = ','.join(test_modules)
              print('Multi-module repo detected. Targeting modules: ' + pl_value)
              with open('pr-agent-artifacts/mvn-pl-flag.txt', 'w') as f:
                  f.write(pl_value)
          except Exception as e:
              print('Multi-module detection skipped: ' + str(e))
          MULTIMOD_PYEOF
            if [ -f pr-agent-artifacts/mvn-pl-flag.txt ]; then
              MVN_PL_FLAG="-pl $(cat pr-agent-artifacts/mvn-pl-flag.txt) --also-make"
              echo "Using Maven project list: $MVN_PL_FLAG"
            fi
            # Run tests per type — separate Maven phases for isolation
            # Phase A: unit tests (*Test, excluding *FunctionalTest and *IntegrationTest)
            MVN_RC=0
            UNIT_RC=0
            FUNC_RC=0
            INT_RC=0
            echo "=== Phase A: Unit tests ==="
            mvn test $MVN_PL_FLAG -Dtest="!*FunctionalTest,!*IntegrationTest" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee pr-agent-artifacts/mvn-unit.log || UNIT_RC=$?
            # Phase B: functional tests (*FunctionalTest)
            echo "=== Phase B: Functional tests ==="
            mvn test $MVN_PL_FLAG -Dtest="*FunctionalTest" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee pr-agent-artifacts/mvn-functional.log || FUNC_RC=$?
            # Phase C: integration tests (*IntegrationTest)
            # Skipped entirely when Docker is unavailable (SKIP_INTEGRATION=true) to prevent
            # @Testcontainers failures from burning self-heal budget on an infra issue.
            echo "=== Phase C: Integration tests ==="
            if [ "${SKIP_INTEGRATION:-false}" = "true" ]; then
              echo "Phase C skipped — Docker not available on this runner (SKIP_INTEGRATION=true)"
              echo "Integration tests require Docker. Use a self-hosted runner or enable Docker-in-Docker." | tee pr-agent-artifacts/mvn-integration.log
            else
              mvn test $MVN_PL_FLAG -Dtest="*IntegrationTest" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee pr-agent-artifacts/mvn-integration.log || INT_RC=$?
            fi
            # Overall exit code: fail if unit tests failed (primary)
            if [ $UNIT_RC -ne 0 ]; then
              MVN_RC=$UNIT_RC
            elif [ $FUNC_RC -ne 0 ]; then
              MVN_RC=$FUNC_RC
            elif [ $INT_RC -ne 0 ]; then
              MVN_RC=$INT_RC
            fi
            # Capture surefire error summary for self-heal callback
            if [ -d target/surefire-reports ]; then
              grep -h -A2 'FAILURE\|ERROR' target/surefire-reports/*.txt 2>/dev/null | head -200 > pr-agent-artifacts/surefire-errors.txt || true
            fi
            # Fallback: if no surefire reports and mvn failed, extract build errors from Maven log
            if [ ! -d target/surefire-reports ] && [ $MVN_RC -ne 0 ]; then
              tail -80 pr-agent-artifacts/mvn-unit.log > pr-agent-artifacts/surefire-errors.txt 2>/dev/null || true
              echo "Maven build failed (exit $MVN_RC) before tests could run" >> pr-agent-artifacts/surefire-errors.txt
            fi
            # Collect JaCoCo coverage reports
            for JACOCO_PATH in target/site/jacoco/jacoco.xml target/jacoco.xml; do
              if [ -f "$JACOCO_PATH" ]; then
                cp "$JACOCO_PATH" pr-agent-artifacts/jacoco.xml
                break
              fi
            done
            # Parse coverage summary
            if [ -f pr-agent-artifacts/jacoco.xml ]; then
              python3 <<'COV_PYEOF' || true
          import xml.etree.ElementTree as ET, json, os
          try:
              tree = ET.parse('pr-agent-artifacts/jacoco.xml')
              root = tree.getroot()
              counters = {}
              for c in root.findall('.//counter'):
                  t = c.get('type','')
                  missed = int(c.get('missed','0'))
                  covered = int(c.get('covered','0'))
                  total = missed + covered
                  counters[t.lower()] = {'covered': covered, 'missed': missed, 'total': total, 'pct': round(covered/total*100,1) if total else 0}
              with open('pr-agent-artifacts/coverage-summary.json','w') as f:
                  json.dump(counters, f)
              line = counters.get('line',{})
              branch = counters.get('branch',{})
              print(f"Coverage: lines={line.get('pct',0)}% branches={branch.get('pct',0)}%")
          except Exception as e:
              print(f'Coverage parse skipped: {e}')
          COV_PYEOF
            fi
            # Propagate mvn test exit code (step fails if tests failed, but coverage is collected)
            exit $MVN_RC
          elif [ "$LANG" = "node" ]; then
            npm ci
            npm test -- --coverage || npm test || true
            if [ -f coverage/coverage-final.json ]; then
              cp coverage/coverage-final.json pr-agent-artifacts/istanbul.json
            fi
          elif [ "$LANG" = "python" ]; then
            # --- Install dependencies ---
            if [ -f requirements.txt ]; then
              python3 -m pip install -r requirements.txt || true
            fi
            if [ -f pyproject.toml ]; then
              python3 -m pip install -e '.[test]' 2>/dev/null || python3 -m pip install -e '.[dev]' 2>/dev/null || true
            fi
            python3 -m pip install pytest pytest-cov pytest-asyncio 2>/dev/null || true

            # --- Django auto-detection ---
            if [ -f manage.py ]; then
              echo "Django project detected (manage.py found)"
              python3 -m pip install pytest-django 2>/dev/null || true
              # Auto-detect DJANGO_SETTINGS_MODULE if not already set
              if [ -z "$DJANGO_SETTINGS_MODULE" ]; then
                DJANGO_SETTINGS_MODULE=$(python3 -c "
          import re, glob
          for f in glob.glob('*/settings.py') + glob.glob('*/settings/*.py') + glob.glob('config/settings.py'):
              with open(f) as fh:
                  if 'INSTALLED_APPS' in fh.read():
                      mod = f.replace('/', '.').replace('.py', '')
                      print(mod)
                      break
          " 2>/dev/null || true)
                if [ -n "$DJANGO_SETTINGS_MODULE" ]; then
                  export DJANGO_SETTINGS_MODULE
                  echo "Auto-detected DJANGO_SETTINGS_MODULE=$DJANGO_SETTINGS_MODULE"
                fi
              fi
              # Create pytest.ini with django settings if not present
              if [ -n "$DJANGO_SETTINGS_MODULE" ] && ! grep -q 'DJANGO_SETTINGS_MODULE' pytest.ini 2>/dev/null && ! grep -q 'DJANGO_SETTINGS_MODULE' pyproject.toml 2>/dev/null; then
                echo "[pytest]" > pytest.ini
                echo "DJANGO_SETTINGS_MODULE = $DJANGO_SETTINGS_MODULE" >> pytest.ini
                echo "Created pytest.ini with DJANGO_SETTINGS_MODULE=$DJANGO_SETTINGS_MODULE"
              fi
              # Run migrations for test database
              python3 manage.py migrate --run-syncdb --no-input 2>/dev/null || true
            fi

            # --- Syntax-check-and-prune: remove test files that fail py_compile ---
            python3 <<'PYPRUNE_EOF' || true
          import py_compile, glob, os, sys
          NL = chr(10)
          pruned = []
          for tf in sorted(glob.glob('tests/**/test_*.py', recursive=True)):
              try:
                  py_compile.compile(tf, doraise=True)
              except py_compile.PyCompileError as e:
                  pruned.append(tf + ': ' + str(e)[:200])
                  os.remove(tf)
          if pruned:
              print('PRUNED ' + str(len(pruned)) + ' test file(s) with syntax errors:')
              for p in pruned:
                  print('  - ' + p)
              os.makedirs('pr-agent-artifacts', exist_ok=True)
              with open('pr-agent-artifacts/compile-errors.txt', 'w') as f:
                  f.write(NL.join(pruned))
          PYPRUNE_EOF

            # --- Run pytest per test type for isolation ---
            PYTEST_RC=0
            UNIT_RC=0
            FUNC_RC=0
            INT_RC=0

            # Phase A: unit tests (tests/ excluding functional/ and integration/)
            echo "=== Phase A: Unit tests ==="
            python3 -m pytest \
              --maxfail=5 \
              --disable-warnings \
              -q \
              --cov \
              --cov-report=xml:coverage.xml \
              --junitxml=pr-agent-artifacts/pytest-unit.xml \
              --ignore=tests/functional \
              --ignore=tests/integration \
              || UNIT_RC=$?

            # Fallback: retry without coverage if first run failed on plugin issues
            if [ $UNIT_RC -ne 0 ] && ! [ -f pr-agent-artifacts/pytest-unit.xml ]; then
              python3 -m pytest -q --junitxml=pr-agent-artifacts/pytest-unit.xml --ignore=tests/functional --ignore=tests/integration || UNIT_RC=$?
            fi

            # Phase B: functional tests (tests/functional/)
            if [ -d tests/functional ]; then
              echo "=== Phase B: Functional tests ==="
              python3 -m pytest \
                tests/functional/ \
                --maxfail=5 \
                --disable-warnings \
                -q \
                --junitxml=pr-agent-artifacts/pytest-functional.xml \
                2>/dev/null || FUNC_RC=$?
            fi

            # Phase C: integration tests (tests/integration/)
            if [ -d tests/integration ]; then
              echo "=== Phase C: Integration tests ==="
              python3 -m pytest \
                tests/integration/ \
                --maxfail=5 \
                --disable-warnings \
                -q \
                --junitxml=pr-agent-artifacts/pytest-integration.xml \
                2>/dev/null || INT_RC=$?
            fi

            # Merge JUnit XMLs into single results file for backward compat
            python3 <<'PYMERGE_EOF' || true
          import os, shutil
          primary = 'pr-agent-artifacts/pytest-unit.xml'
          dest = 'pr-agent-artifacts/pytest-results.xml'
          if os.path.isfile(primary):
              shutil.copy2(primary, dest)
          PYMERGE_EOF

            # Overall exit code: fail if unit tests failed (primary)
            if [ $UNIT_RC -ne 0 ]; then
              PYTEST_RC=$UNIT_RC
            elif [ $FUNC_RC -ne 0 ]; then
              PYTEST_RC=$FUNC_RC
            elif [ $INT_RC -ne 0 ]; then
              PYTEST_RC=$INT_RC
            fi

            # --- Coverage summary → JSON (mirrors Java/JaCoCo flow) ---
            if [ -f coverage.xml ]; then
              cp coverage.xml pr-agent-artifacts/coverage.xml
              python3 <<'PYCOV_EOF' || true
          import xml.etree.ElementTree as ET, json, os
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              line_rate = float(root.get('line-rate', '0') or 0)
              branch_rate = float(root.get('branch-rate', '0') or 0)
              summary = {
                  'line_coverage': round(line_rate * 100, 2),
                  'branch_coverage': round(branch_rate * 100, 2),
              }
              os.makedirs('pr-agent-artifacts', exist_ok=True)
              with open('pr-agent-artifacts/coverage-summary.json', 'w') as f:
                  json.dump(summary, f)
              print('Coverage: line=' + str(summary['line_coverage']) + '% branch=' + str(summary['branch_coverage']) + '%')
          except Exception as e:
              print('coverage parse error: ' + str(e))
          PYCOV_EOF
            fi

            # --- Capture pytest error output for self-heal ---
            if [ -f pr-agent-artifacts/pytest-results.xml ]; then
              python3 <<'PYERR_EOF' || true
          import xml.etree.ElementTree as ET, os, json
          NL = chr(10)
          try:
              tree = ET.parse('pr-agent-artifacts/pytest-results.xml')
              root = tree.getroot()
              errors = []
              for tc in root.iter('testcase'):
                  for tag in ('failure', 'error'):
                      elem = tc.find(tag)
                      if elem is not None:
                          msg = (elem.get('message', '') or '')[:500]
                          text = (elem.text or '')[:1000]
                          errors.append(tc.get('classname', '') + '::' + tc.get('name', '') + NL + msg + NL + text)
              if errors:
                  os.makedirs('pr-agent-artifacts', exist_ok=True)
                  with open('pr-agent-artifacts/pytest-errors.txt', 'w') as f:
                      f.write((NL + '---' + NL).join(errors[:30]))
          except Exception as e:
              print('pytest XML parse error: ' + str(e))
          PYERR_EOF
            fi

            # Propagate pytest exit code
            exit $PYTEST_RC
          else
            echo "Unknown language '$LANG'" >&2
            exit 2
          fi

      - name: Upload artifacts to S3
        if: always()
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          # Include surefire reports for self-heal diagnostics
          if [ -d target/surefire-reports ]; then
            cp -r target/surefire-reports pr-agent-artifacts/surefire-reports
          fi
          ARTIFACT_KEY="pr-agent/${{ inputs.agent_run_id }}/artifacts"
          ARTIFACT_OBJECT_KEY="$ARTIFACT_KEY/pr-agent-artifacts.tgz"
          echo "artifact_key=$ARTIFACT_KEY" >> $GITHUB_OUTPUT
          echo "artifact_object_key=$ARTIFACT_OBJECT_KEY" >> $GITHUB_OUTPUT
          tar -czf pr-agent-artifacts.tgz -C pr-agent-artifacts .
          aws s3 cp pr-agent-artifacts.tgz "s3://${{ secrets.PR_AGENT_S3_BUCKET }}/$ARTIFACT_OBJECT_KEY"

      - name: Build callback payload
        if: always()
        id: callback_payload
        shell: bash
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi
          python3 - "$STATUS" <<'PYEOF'
          import json, os, sys
          status = sys.argv[1] if len(sys.argv) > 1 else "failure"
          raw = os.environ.get('DETECTED_STACK', '{}')
          try:
              ds = json.loads(raw) if raw else {}
          except Exception:
              ds = {"raw": raw}
          # Load coverage summary if available
          cov = {}
          try:
              with open('pr-agent-artifacts/coverage-summary.json') as cf:
                  cov = json.load(cf)
          except Exception:
              pass
          # Load surefire error summary for self-heal (Phase 2/4)
          error_log = ''
          try:
              with open('pr-agent-artifacts/surefire-errors.txt') as ef:
                  error_log = ef.read().strip()[:8000]
          except Exception:
              pass
          # Load pytest error summary for Python self-heal
          if not error_log:
              try:
                  with open('pr-agent-artifacts/pytest-errors.txt') as pf:
                      error_log = pf.read().strip()[:8000]
              except Exception:
                  pass
          # Fallback: compile errors (when all tests pruned, no surefire/pytest reports exist)
          if not error_log:
              try:
                  with open('pr-agent-artifacts/compile-errors.txt') as cf:
                      error_log = cf.read().strip()[:8000]
              except Exception:
                  pass
          # Parse surefire XML reports for structured failure data + test type counts
          test_failures = []
          test_type_counts = {'unit': 0, 'functional': 0, 'integration': 0}
          surefire_dir = 'pr-agent-artifacts/surefire-reports'
          try:
              import glob
              for xml_path in sorted(glob.glob(surefire_dir + '/TEST-*.xml'))[:50]:
                  import xml.etree.ElementTree as ET
                  tree = ET.parse(xml_path)
                  root = tree.getroot()
                  suite_name = root.get('name', '')
                  tests_in_suite = int(root.get('tests', '0'))
                  testcases = root.findall('.//testcase')
                  def _infer_type(name):
                      n = (name or '').lower()
                      if 'functionaltest' in n:
                          return 'functional'
                      if 'integrationtest' in n:
                          return 'integration'
                      return ''
                  ttype = _infer_type(suite_name)
                  if not ttype:
                      ttype = _infer_type(os.path.basename(xml_path))
                  if not ttype:
                      for tc in testcases:
                          cn = tc.get('classname', '')
                          ttype = _infer_type(cn)
                          if ttype:
                              break
                  if ttype == 'functional':
                      test_type_counts['functional'] += tests_in_suite
                  elif ttype == 'integration':
                      test_type_counts['integration'] += tests_in_suite
                  else:
                      test_type_counts['unit'] += tests_in_suite
                  for tc in testcases:
                      failure = tc.find('failure')
                      error = tc.find('error')
                      elem = failure if failure is not None else error
                      if elem is not None:
                          test_failures.append({
                              'class': tc.get('classname', suite_name),
                              'method': tc.get('name', ''),
                              'type': elem.get('type', ''),
                              'message': (elem.get('message', '') or '')[:500],
                          })
          except Exception:
              pass
          # Parse pytest JUnit XMLs for Python test type counts + failures
          # Per-type XMLs (from isolated CI phases) are the primary source;
          # fallback to single results file with classname-based heuristic.
          _pytest_type_files = {
              'unit': 'pr-agent-artifacts/pytest-unit.xml',
              'functional': 'pr-agent-artifacts/pytest-functional.xml',
              'integration': 'pr-agent-artifacts/pytest-integration.xml',
          }
          _found_typed_xml = False
          try:
              import xml.etree.ElementTree as ET
              for _ttype, _xml_path in _pytest_type_files.items():
                  if not os.path.isfile(_xml_path):
                      continue
                  _found_typed_xml = True
                  _tree = ET.parse(_xml_path)
                  _root = _tree.getroot()
                  for tc in _root.iter('testcase'):
                      test_type_counts[_ttype] = test_type_counts.get(_ttype, 0) + 1
                      for tag in ('failure', 'error'):
                          elem = tc.find(tag)
                          if elem is not None:
                              test_failures.append({
                                  'class': tc.get('classname', ''),
                                  'method': tc.get('name', ''),
                                  'type': elem.get('type', ''),
                                  'message': (elem.get('message', '') or '')[:500],
                              })
          except Exception:
              pass
          # Fallback: parse single results file with classname heuristic
          if not _found_typed_xml:
              pytest_xml = 'pr-agent-artifacts/pytest-results.xml'
              try:
                  import xml.etree.ElementTree as ET
                  if os.path.isfile(pytest_xml):
                      tree = ET.parse(pytest_xml)
                      root = tree.getroot()
                      for tc in root.iter('testcase'):
                          cn = tc.get('classname', '') or ''
                          name = tc.get('name', '') or ''
                          full = cn + '::' + name
                          if 'integration' in full.lower():
                              test_type_counts['integration'] += 1
                          elif 'functional' in full.lower():
                              test_type_counts['functional'] += 1
                          else:
                              test_type_counts['unit'] += 1
                          for tag in ('failure', 'error'):
                              elem = tc.find(tag)
                              if elem is not None:
                                  test_failures.append({
                                      'class': cn,
                                      'method': name,
                                      'type': elem.get('type', ''),
                                      'message': (elem.get('message', '') or '')[:500],
                                  })
              except Exception:
                  pass
          body = json.dumps({
              "agent_run_id": os.environ.get('RUN_ID', ''),
              "pr_number": os.environ.get('PR_NUM', ''),
              "head_sha": os.environ.get('HEAD_SHA', ''),
              "status": status,
              "artifact_key": os.environ.get('ART_KEY', ''),
              "artifact_bucket": os.environ.get('ART_BUCKET', ''),
              "artifact_object_key": os.environ.get('ART_OBJ_KEY', ''),
              "detected_stack": ds,
              "coverage": cov,
              "error_log": error_log,
              "test_failures": test_failures[:50],
              "test_type_counts": test_type_counts,
          })
          # Write to a temp file so the callback step can sign and send from
          # exactly the same bytes (GITHUB_OUTPUT truncates on newlines inside
          # error_log, causing signature mismatch and a 401 from the agent).
          with open('/tmp/pr_agent_callback.json', 'w') as f:
              f.write(body)
          PYEOF
        env:
          RUN_ID: "${{ inputs.agent_run_id }}"
          PR_NUM: "${{ inputs.pr_number }}"
          HEAD_SHA: "${{ inputs.head_sha }}"
          ART_KEY: "${{ steps.upload.outputs.artifact_key }}"
          ART_BUCKET: "${{ secrets.PR_AGENT_S3_BUCKET }}"
          ART_OBJ_KEY: "${{ steps.upload.outputs.artifact_object_key }}"
          DETECTED_STACK: "${{ inputs.detected_stack }}"

      - name: Callback to PR Agent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Sign and send from the same file written by the build step to guarantee
          # the HMAC is computed over exactly the bytes that curl will transmit.
          SIG=$(python3 - <<'PYEOF'
          import hmac, hashlib, os, sys
          try:
              secret = os.environ['CALLBACK_SECRET'].encode()
              with open('/tmp/pr_agent_callback.json', 'rb') as f:
                  body = f.read()
              print(hmac.new(secret, body, hashlib.sha256).hexdigest())
          except Exception as e:
              print(f"Error generating signature: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF
          )
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "X-PR-Agent-Signature: sha256=$SIG" \
            --data-binary "@/tmp/pr_agent_callback.json" \
            "https://7jsur28fwi.execute-api.us-east-1.amazonaws.com/workflow-callback"
          rm -f /tmp/pr_agent_callback.json
        env:
          CALLBACK_SECRET: "${{ secrets.PR_AGENT_CALLBACK_SECRET }}"
