name: Build agentic-test-generation-java JAR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-agentic-java:
    runs-on: ubuntu-latest

    steps:
      - name: Check out agentic-test-generation-java repo
        uses: actions/checkout@v4
        with:
          repository: BayRockLabs/agentic-test-generation-java
          path: agentic-test-generation-java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      - name: Build with Maven
        working-directory: agentic-test-generation-java
        run: mvn -ntp -DskipTests package spring-boot:repackage

      - name: List built JARs
        working-directory: agentic-test-generation-java
        run: |
          echo "Built JARs:"
          find . -name "*.jar" -maxdepth 5 -print
